# CLA gate: every contributor must sign the CLA (CLA.md) before their PR can merge.
# Uses the self-hosted CLA Assistant action — signatures are recorded in-repo at
# signatures/version1/cla.json, so there's no external service to depend on.
#
# A contributor signs by commenting the exact sentence in `custom-pr-sign-comment`
# on their pull request; the bot records it and re-checks.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write          # to write the signatures file
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Th3X1V/MonarchAegis/blob/main/CLA.md'
          branch: 'main'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: >
            Thanks for your pull request! Before it can be merged, please read our
            [Contributor License Agreement](https://github.com/Th3X1V/MonarchAegis/blob/main/CLA.md)
            and sign it by posting the following comment on this PR:
          # Owner + bots never need to sign:
          allowlist: 'Th3X1V,dependabot[bot],github-actions[bot]'
